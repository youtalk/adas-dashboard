<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADAS dashboard</title>
    <style>
      :root {
        --bg: #0b0f14;
        --fg: #94a3b8;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
      }
      #scene {
        position: fixed;
        inset: 0;
      }
      #status {
        position: fixed;
        left: 16px;
        bottom: 16px;
        font-size: 14px;
        z-index: 10;
      }
      #credit {
        position: fixed;
        right: 16px;
        bottom: 16px;
        font-size: 11px;
        opacity: 0.45;
        z-index: 10;
      }
      #credit a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="status">Waiting for vehicle...</div>
    <div id="credit">
      Vehicle meshes:
      <a
        href="https://github.com/autowarefoundation/autoware_rviz_plugins"
        target="_blank"
        rel="noopener"
        >Sebastian Preuße</a
      >,
      <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener"
        >CC BY-SA 4.0</a
      >
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

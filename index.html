<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADAS dashboard</title>
    <style>
      :root {
        --bg: #0b0f14;
        --fg: #94a3b8;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
      }
      #scene {
        position: fixed;
        inset: 0;
      }
      #status {
        position: fixed;
        left: 16px;
        bottom: 16px;
        font-size: 14px;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="status">Waiting for vehicle...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

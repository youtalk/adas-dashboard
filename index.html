<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADAS dashboard</title>
    <style>
      /* Color tokens (design section 6.5). The light theme (key t) only
         redefines tokens; theme.ts copies the scene colors into three.js. */
      :root {
        --bg-top: #0b0f14;
        --bg-bottom: #1c2530;
        --road: #161d26;
        --map-lane: #4b5661;
        --lane: #22d3ee;
        --traj: #22c55e;
        --traffic: #3b82f6;
        --lead: #ef4444;
        --ego: #d9d9d9;
        --alert: #b91c1c;
        --on-alert: #ffffff;
        --takeover: #fb923c;
        --ambient: #334455;
        --fg: #94a3b8;
        --fg-strong: #e2e8f0;
        --panel-bg: rgba(11, 15, 20, 0.84);
        --panel-border: #1e2a35;
        --track: #1e2a35;
        --center-mark: #4b5661;
        --accel: #22c55e;
        --brake: #ef4444;
        --takeover-strong: #c2410c;
        --on-takeover: #ffffff;
        --takeover-text: #fdba74;
        --pip-bg: #222222;
        --pip-border: #666666;
        --pip-fg: #888888;
        --label-shadow: #000000;
      }
      :root[data-theme="light"] {
        --bg-top: #cfd8e3;
        --bg-bottom: #f1f5f9;
        --road: #e8edf2;
        --map-lane: #334155;
        --lane: #0891b2;
        --traj: #16a34a;
        --traffic: #2563eb;
        --lead: #dc2626;
        --ego: #ffffff;
        --alert: #b91c1c;
        --on-alert: #ffffff;
        --takeover: #f97316;
        --ambient: #ffffff;
        --fg: #475569;
        --fg-strong: #0f172a;
        --panel-bg: rgba(255, 255, 255, 0.85);
        --panel-border: #cbd5e1;
        --track: #e2e8f0;
        --center-mark: #94a3b8;
        --accel: #16a34a;
        --brake: #dc2626;
        --takeover-strong: #c2410c;
        --on-takeover: #ffffff;
        --takeover-text: #c2410c;
        --pip-bg: #e2e8f0;
        --pip-border: #94a3b8;
        --pip-fg: #475569;
        --label-shadow: #ffffff;
      }
      [hidden] {
        display: none !important;
      }
      /* Overlay size (design section 6.1): twice the 1080p layout in CSS px, so
         browser zoom makes the overlays larger or smaller. --u is one layout px. */
      :root {
        --ui: 2;
        --u: calc(var(--ui) * 1px);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg-top);
        color: var(--fg);
        font-family: system-ui, sans-serif;
      }
      #scene {
        position: fixed;
        inset: 0;
        background: linear-gradient(var(--bg-top), var(--bg-bottom));
      }
      /* Takeover and Stopped: amber page frame (design section 6.3) */
      #frame {
        position: fixed;
        inset: 0;
        border: calc(100vh * 12 / 1080) solid var(--takeover);
        pointer-events: none;
        z-index: 30;
      }
      /* Lead vehicle distance label (mockup 01). Plain CSS px, so browser zoom
         scales it; main.ts moves it above the lead vehicle every frame. */
      #lead-label {
        position: fixed;
        left: 0;
        top: 0;
        font-size: 20px;
        font-weight: 700;
        color: var(--lead);
        text-shadow:
          0 0 4px var(--label-shadow),
          0 1px 2px var(--label-shadow);
        white-space: nowrap;
        pointer-events: none;
      }
      /* Bottom-left column: HUD panel on top, connection status below it.
         zoom, unlike transform: scale(), also scales the layout box, so the panel
         and the status line under it keep their spacing (design §6.1). */
      #bottom-left {
        zoom: var(--ui);
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        z-index: 10;
      }
      #status {
        font-size: 13px;
        opacity: 0.8;
      }
      #credit {
        position: fixed;
        right: 16px;
        bottom: 16px;
        font-size: 11px;
        opacity: 0.45;
        z-index: 10;
      }
      #credit a {
        color: inherit;
      }

      /* ------------------------------------------------------------------ */
      /* Alert pill — top center (design §6.2)                               */
      /* ------------------------------------------------------------------ */
      /* A long text wraps to more lines. The width keeps the pill clear of the
         camera PiP (16 + 230 + 16 px on each side), but never under 30 percent
         of the page. */
      #alert-pill {
        position: fixed;
        top: calc(16 * var(--u));
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        max-width: max(30vw, calc(100vw - 2 * 262 * var(--u)));
        box-sizing: border-box;
        padding: calc(7 * var(--u)) calc(22 * var(--u));
        border-radius: calc(22 * var(--u));
        text-align: center;
        line-height: 1.25;
        z-index: 20;
        pointer-events: none;
      }
      #alert-pill-text {
        font-size: calc(20 * var(--u)); /* design §6.5: at least 20 px at 1080p */
        font-weight: 700;
        letter-spacing: 0.03em;
      }
      #alert-pill-code {
        margin-left: calc(6 * var(--u));
        font-size: calc(11 * var(--u));
        opacity: 0.75;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }
      #alert-pill[data-severity="warn"],
      #alert-pill[data-severity="critical"],
      #alert-pill[data-severity="lost"] {
        background: var(--alert);
        border: 1px solid var(--alert);
        color: var(--on-alert);
      }
      #alert-pill[data-severity="takeover"] {
        background: var(--takeover-strong);
        border: 1px solid var(--takeover-strong);
        color: var(--on-takeover);
      }

      /* ------------------------------------------------------------------ */
      /* Camera PiP — top right (design §6.1): 230 by 130 layout px              */
      /* ------------------------------------------------------------------ */
      #pip {
        position: fixed;
        top: calc(16 * var(--u));
        right: calc(16 * var(--u));
        width: calc(230 * var(--u));
        height: calc(130 * var(--u));
        background: var(--pip-bg);
        border: 1px solid var(--pip-border);
        overflow: hidden;
        z-index: 20;
      }
      #pip-frame {
        width: 100%;
        height: 100%;
        border: 0;
        pointer-events: none; /* keep keyboard focus on the page */
      }
      #pip.lost #pip-frame {
        opacity: 0.4;
      }
      #pip-lost {
        position: absolute;
        top: calc(8 * var(--u));
        left: calc(10 * var(--u));
        font-size: calc(14 * var(--u));
        color: var(--pip-fg);
      }
      #pip-min {
        position: fixed;
        top: calc(16 * var(--u));
        right: calc(16 * var(--u));
        width: calc(40 * var(--u));
        height: calc(20 * var(--u));
        border-radius: 999px;
        background: var(--pip-bg);
        border: 1px solid var(--pip-border);
        color: var(--pip-fg);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }
      #pip-min svg {
        width: calc(16 * var(--u));
        height: calc(12 * var(--u));
      }

      /* ------------------------------------------------------------------ */
      /* Status panel — bottom left (design §6.1, §6.4)                      */
      /* ------------------------------------------------------------------ */
      /* About 240 by 170 px at 1080p (design §6.1, mockup 01) */
      #hud {
        width: 240px;
        box-sizing: border-box;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        padding: 12px 14px;
        z-index: 10;
        font-size: 13px;
        color: var(--fg);
      }

      /* Speed + limit row */
      .hud-speed-row {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 6px;
      }
      /* Speed with its unit on the same baseline (mockup 01) */
      .hud-speed-block {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      #hud-speed {
        font-size: 46px;
        font-weight: 800;
        color: var(--fg-strong);
        line-height: 1;
        letter-spacing: -1px;
      }
      .hud-speed-unit {
        font-size: 12px;
        letter-spacing: 0.06em;
      }
      #hud-speed-arrow {
        margin-left: 4px;
      }
      /* Takeover and Stopped: supervisor line (mockups 03 and 04) */
      #hud-state-line {
        padding: 4px 0;
        font-size: 13px;
        color: var(--takeover-text);
      }
      /* Speed-limit box: small rounded badge */
      #hud-limit-box {
        border: 2px solid var(--fg-strong);
        border-radius: 5px;
        padding: 3px 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 2px;
      }
      #hud-limit {
        font-size: 18px;
        font-weight: 700;
        color: var(--fg-strong);
        line-height: 1;
      }
      #hud-limit-unit {
        font-size: 9px;
        letter-spacing: 0.08em;
        margin-top: 1px;
      }

      /* Lead vehicle row */
      #hud-lead-row {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 0;
        font-size: 12px;
      }
      .hud-lbl {
        font-size: 10px;
        letter-spacing: 0.06em;
        opacity: 0.5;
        min-width: 30px;
      }
      .hud-val {
        color: var(--fg-strong);
        font-weight: 600;
      }
      .hud-unit {
        font-size: 10px;
        opacity: 0.6;
      }

      /* Steering wheel + pedal bar row */
      .hud-controls-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 0;
      }
      #hud-wheel {
        flex-shrink: 0;
        color: var(--fg);
      }
      .hud-pedal-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .hud-pedal-label {
        font-size: 10px;
        letter-spacing: 0.06em;
        opacity: 0.5;
        margin-bottom: 3px;
      }
      /* Centered bi-directional pedal bar */
      .hud-pedal-bar {
        display: flex;
        align-items: center;
        height: 8px;
        gap: 0;
      }
      .hud-pedal-half {
        flex: 1;
        height: 100%;
        background: var(--track);
        overflow: hidden;
      }
      .hud-pedal-half.left {
        border-radius: 4px 0 0 4px;
        display: flex;
        justify-content: flex-end; /* brake fills from center outward */
      }
      .hud-pedal-half.right {
        border-radius: 0 4px 4px 0;
      }
      .hud-pedal-center {
        width: 2px;
        height: 100%;
        background: var(--center-mark);
        flex-shrink: 0;
      }
      #hud-accel-neg {
        height: 100%;
        width: 0%;
        background: var(--brake);
        border-radius: 4px 0 0 4px;
        transition: width 0.08s linear;
      }
      #hud-accel-pos {
        height: 100%;
        width: 0%;
        background: var(--accel);
        border-radius: 0 4px 4px 0;
        transition: width 0.08s linear;
      }

      /* Status line */
      #hud-status-row {
        border-top: 1px solid var(--panel-border);
        padding-top: 6px;
        margin-top: 4px;
        font-size: 11px;
        text-align: center;
        letter-spacing: 0.04em;
        opacity: 0.7;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* Takeover and Stopped: the pedal bar and status line turn amber (design §6.4) */
      #hud.takeover #hud-accel-neg,
      #hud.takeover #hud-accel-pos {
        background: var(--takeover);
      }
      #hud.takeover #hud-status-row {
        color: var(--takeover-text);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="lead-label" hidden></div>
    <div id="frame" hidden></div>

    <!-- Camera picture-in-picture — top right, key c (design §6.1) -->
    <div id="pip">
      <iframe id="pip-frame" title="camera" allow="autoplay" hidden></iframe>
      <div id="pip-lost">camera lost</div>
    </div>
    <div id="pip-min" hidden>
      <svg viewBox="0 0 16 12" width="16" height="12" aria-label="camera">
        <rect x="0.5" y="2.5" width="10" height="8" rx="1.5" fill="none" stroke="currentColor" />
        <path d="M11 5.5 L15.5 3 L15.5 10 L11 7.5 Z" fill="currentColor" />
      </svg>
    </div>

    <!-- Alert pill — top center -->
    <div id="alert-pill" hidden>
      <span id="alert-pill-text"></span>
      <span id="alert-pill-code"></span>
    </div>

    <!-- Bottom-left column: HUD panel above, connection status below -->
    <div id="bottom-left">
      <!-- Status panel (design §6.1) -->
      <div id="hud" hidden>
        <!-- Speed and speed limit -->
        <div class="hud-speed-row">
          <div class="hud-speed-block">
            <span id="hud-speed">--</span>
            <span class="hud-speed-unit"
              ><span id="hud-speed-unit">km/h</span><span id="hud-speed-arrow" hidden>↓</span></span
            >
          </div>
          <div id="hud-limit-box" hidden>
            <span id="hud-limit">--</span>
            <span id="hud-limit-unit" class="hud-speed-unit">km/h</span>
          </div>
        </div>

        <!-- Takeover and Stopped: what the supervisor is doing -->
        <div id="hud-state-line" hidden></div>

        <!-- Lead vehicle distance and time gap -->
        <div id="hud-lead-row" hidden>
          <span class="hud-lbl">LEAD</span>
          <span id="hud-lead-dist" class="hud-val">--</span>
          <span class="hud-unit">m</span>
          <span style="margin-left: 6px" id="hud-lead-gap" class="hud-val">--</span>
          <span class="hud-unit">s gap</span>
        </div>

        <!-- Steering wheel icon + single signed pedal bar -->
        <div class="hud-controls-row">
          <svg id="hud-wheel" viewBox="-12 -12 24 24" width="32" height="32" aria-hidden="true">
            <circle r="11" fill="none" stroke="currentColor" stroke-width="1.5" />
            <circle r="2.5" fill="currentColor" />
            <!-- Three spokes (no top spoke), so the turn angle reads at a glance -->
            <line x1="0" y1="2.5" x2="0" y2="11" stroke="currentColor" stroke-width="1.5" />
            <line x1="-2.5" y1="0" x2="-11" y2="0" stroke="currentColor" stroke-width="1.5" />
            <line x1="2.5" y1="0" x2="11" y2="0" stroke="currentColor" stroke-width="1.5" />
          </svg>
          <div class="hud-pedal-wrap">
            <div class="hud-pedal-label">PEDAL</div>
            <div class="hud-pedal-bar">
              <div class="hud-pedal-half left">
                <div id="hud-accel-neg"></div>
              </div>
              <div class="hud-pedal-center"></div>
              <div class="hud-pedal-half right">
                <div id="hud-accel-pos"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Stack status line -->
        <div id="hud-status-row"><span id="hud-status"></span></div>
      </div>
      <!-- Connection status below the HUD panel -->
      <div id="status">Waiting for vehicle...</div>
    </div>

    <div id="credit">
      Vehicle meshes:
      <a
        href="https://github.com/autowarefoundation/autoware_rviz_plugins"
        target="_blank"
        rel="noopener"
        >Sebastian Preuße</a
      >,
      <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener"
        >CC BY-SA 4.0</a
      >
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
